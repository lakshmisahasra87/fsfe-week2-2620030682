
<html>
<head>
<title>Login Page</title>

<style>
body {
    font-family: Arial;
    background-image: url("login-background.jpg");
    background-size: cover;
    background-position: center;
}

.box {
    width: 350px;
    margin: 50px auto;
    padding: 30px;
    background-color: rgba(255,255,255,0.9);
    text-align: center;
}

input {
    width: 90%;
    padding: 12px;
    margin: 10px;
    box-sizing: border-box;
}

button {
    width: 90%;
    padding: 12px;
    color: white;
    border: none;
    cursor: pointer;
}

.login {
    background-color: blue;
    width: auto;
}

.facebook {
    background-color: #344f91;
}

.twitter {
    background-color: #00aced;
}

.google {
    background-color: red;
}
</style>
</head>

<body>

<div class="box">

<h2>Login</h2>

<input type="text" placeholder="Username or email">

<input type="password" placeholder="Password">

<p><input type="checkbox" style="width:auto;"> Remember me</p>

<button class="login">LOGIN</button>

<p>Register now | Forgot password?</p>

<p>OR</p>

<button class="facebook">LOGIN WITH FACEBOOK</button>
<br><br>

<button class="twitter">LOGIN WITH TWITTER</button>
<br><br>

<button class="google">LOGIN WITH GOOGLE</button>

</div>

</body>
</html>
