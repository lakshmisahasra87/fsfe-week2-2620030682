
<!DOCTYPE html>
<html>
<head>
    <title>Library Book Categories</title>
    <style>
        h2 {
            text-align: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 130px);
            gap: 10px;
            width: fit-content;
            margin: auto;
        }

        .grid-item {
            background-color: lightgray;
            border: 2px solid black;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Library Book Categories</h2>

    <div class="grid-container">
        <div class="grid-item">Science</div>
        <div class="grid-item">Mathematics</div>
        <div class="grid-item">History</div>
        <div class="grid-item">Literature</div>
        <div class="grid-item">Technology</div>
        <div class="grid-item">Arts</div>
    </div>

</body>
</html>
